<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A Jornada de Michelle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow: hidden;
            background: #101428;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 10px;
            color: white;
            font-family: 'Pixelify Sans', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: min(100vw - 20px, 800px);
            max-height: calc(100dvh - 20px);
            aspect-ratio: 4 / 3;
            border: 4px solid gold;
            border-radius: 12px;
            background: #000;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #000;
        }

        #ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .hud-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.72);
            border: 2px solid rgba(255, 215, 0, 0.85);
            border-radius: 10px;
            color: #ffd700;
            text-shadow: 1px 1px 2px #000;
        }

        .controls {
            top: 10px;
            left: 10px;
            padding: 10px;
            font-size: 12px;
        }

        .level-indicator {
            top: 10px;
            right: 10px;
            padding: 10px 14px;
            font-size: 14px;
            max-width: 45%;
            text-align: center;
        }

        .sound-toggle {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 15px;
            cursor: pointer;
            font-family: 'Pixelify Sans', cursive;
            font-size: 14px;
            pointer-events: auto;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .sound-toggle:hover,
        .sound-toggle:focus-visible {
            background: rgba(255, 215, 0, 0.2);
            transform: translateX(-50%) scale(1.04);
            outline: none;
        }

        .sound-toggle.muted {
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .start-button {
            position: absolute;
            left: 50%;
            bottom: 74px;
            transform: translateX(-50%);
            padding: 14px 24px;
            border: 3px solid #ffd700;
            border-radius: 999px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            font-family: 'Pixelify Sans', cursive;
            font-size: 18px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 25;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.35);
            animation: buttonPulse 1.4s ease-in-out infinite alternate;
        }

        .start-button.is-hidden {
            display: none;
        }

        @keyframes buttonPulse {
            from { transform: translateX(-50%) scale(1); }
            to { transform: translateX(-50%) scale(1.05); }
        }

        .interaction-hint {
            position: absolute;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            padding: 10px 15px;
            display: none;
            font-size: 14px;
            animation: hintPulse 1.2s ease-in-out infinite alternate;
        }

        @keyframes hintPulse {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        .dialog {
            position: absolute;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            width: min(92%, 540px);
            padding: 20px;
            background: rgba(0, 0, 0, 0.92);
            border: 3px solid #ffd700;
            border-radius: 14px;
            text-align: center;
            display: none;
            pointer-events: auto;
            z-index: 30;
        }

        .dialog h3 {
            color: #ffd700;
            margin-bottom: 12px;
            font-size: 20px;
        }

        .dialog p {
            margin-bottom: 14px;
            line-height: 1.45;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            color: white;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            font-family: 'Pixelify Sans', cursive;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .option-btn:hover,
        .option-btn:focus-visible {
            transform: scale(1.03);
            filter: brightness(1.1);
            outline: none;
        }

        .option-btn.correct {
            background: linear-gradient(45deg, #00d2d3, #54a0ff);
        }

        .option-btn.wrong {
            background: linear-gradient(45deg, #ff3838, #ff6b6b);
        }

        .mobile-controls {
            position: absolute;
            left: 50%;
            bottom: 8px;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 14px;
            pointer-events: auto;
            z-index: 20;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 44px);
            grid-template-rows: repeat(3, 44px);
            gap: 4px;
            padding: 8px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
        }

        .d-pad-btn,
        .interact-btn {
            border: 2px solid #ffd700;
            border-radius: 10px;
            background: linear-gradient(45deg, #333, #666);
            color: #ffd700;
            font-family: 'Pixelify Sans', cursive;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }

        .d-pad-btn {
            width: 44px;
            height: 44px;
            font-size: 18px;
        }

        .d-pad-spacer {
            width: 44px;
            height: 44px;
        }

        .interact-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            color: white;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            font-size: 12px;
            line-height: 1.2;
        }

        .d-pad-btn.active,
        .interact-btn.active,
        .d-pad-btn:active,
        .interact-btn:active {
            transform: scale(0.94);
            background: linear-gradient(45deg, #ffd700, #ffa500);
            color: #1a1a2e;
        }

        .fireworks {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 35;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: firework 2s ease-out forwards;
        }

        @keyframes firework {
            0% { opacity: 1; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(2); }
        }

        .final-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(92%, 600px);
            padding: 36px;
            text-align: center;
            display: none;
            z-index: 40;
            background: rgba(0, 0, 0, 0.96);
            border: 4px solid #ffd700;
            border-radius: 16px;
        }

        .final-message h2 {
            color: #ffd700;
            font-size: 28px;
            margin-bottom: 18px;
        }

        .final-message p {
            color: #ff69b4;
            font-size: 18px;
            line-height: 1.5;
        }

        @media (pointer: coarse), (max-width: 768px) {
            body {
                padding: 4px;
            }

            #gameContainer {
                width: min(100vw - 8px, calc((100dvh - 8px) * 4 / 3));
                max-height: calc(100dvh - 8px);
                border-width: 2px;
            }

            .controls {
                display: none;
            }

            .level-indicator {
                top: 48px;
                right: 6px;
                max-width: 52%;
                padding: 7px 9px;
                font-size: 11px;
            }

            .sound-toggle {
                top: 6px;
                padding: 7px 10px;
                font-size: 11px;
            }

            .start-button {
                bottom: 126px;
                font-size: 15px;
                padding: 12px 18px;
            }

            .mobile-controls {
                display: flex;
            }

            .interaction-hint {
                bottom: 106px;
                font-size: 12px;
                padding: 8px 10px;
            }

            .dialog {
                bottom: 112px;
                padding: 14px;
            }

            .dialog h3 {
                font-size: 16px;
            }

            .dialog p,
            .option-btn {
                font-size: 12px;
            }
        }

        @media (orientation: landscape) and (max-height: 460px) {
            .mobile-controls {
                right: 8px;
                left: auto;
                bottom: 8px;
                transform: none;
                flex-direction: column;
                gap: 8px;
            }

            .d-pad {
                grid-template-columns: repeat(3, 38px);
                grid-template-rows: repeat(3, 38px);
            }

            .d-pad-btn,
            .d-pad-spacer {
                width: 38px;
                height: 38px;
            }

            .interact-btn {
                width: 64px;
                height: 64px;
                font-size: 10px;
            }

            .dialog {
                bottom: 12px;
                width: min(78%, 520px);
            }
        }
    </style>
</head>
<body>
    <main id="gameContainer" aria-label="A Jornada de Michelle">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <section id="ui" aria-live="polite" style="display: none;">
            <button class="sound-toggle hud-panel" id="soundToggle" type="button">🔊 SOM</button>

            <div class="controls hud-panel">
                <div>Use ↑↓←→ ou WASD para mover</div>
                <div>ESPAÇO/ENTER para interagir</div>
            </div>

            <div class="level-indicator hud-panel" id="levelIndicator">Vila Mágica do Amor ❤️</div>

            <button class="start-button" id="startGameBtn" type="button">✨ Iniciar Jornada ✨</button>

            <div class="interaction-hint hud-panel" id="interactionHint">Pressione ESPAÇO para interagir</div>

            <div class="dialog" id="questionDialog" role="dialog" aria-modal="true">
                <h3 id="questionTitle">Pergunta</h3>
                <p id="questionText"></p>
                <div class="options" id="questionOptions"></div>
                <p id="questionResult"></p>
            </div>

            <div class="final-message" id="finalMessage">
                <h2>💖 Parabéns! 💖</h2>
                <p>Não é fim de jogo...<br>é o começo de uma nova jornada ❤️</p>
            </div>

            <div class="mobile-controls" id="mobileControls" aria-label="Controles móveis">
                <div class="d-pad">
                    <div class="d-pad-spacer"></div>
                    <button class="d-pad-btn" type="button" data-direction="up" aria-label="Mover para cima">↑</button>
                    <div class="d-pad-spacer"></div>
                    <button class="d-pad-btn" type="button" data-direction="left" aria-label="Mover para esquerda">←</button>
                    <div class="d-pad-spacer"></div>
                    <button class="d-pad-btn" type="button" data-direction="right" aria-label="Mover para direita">→</button>
                    <div class="d-pad-spacer"></div>
                    <button class="d-pad-btn" type="button" data-direction="down" aria-label="Mover para baixo">↓</button>
                    <div class="d-pad-spacer"></div>
                </div>
                <button class="interact-btn" id="interactBtn" type="button">AÇÃO<br><small>Interagir</small></button>
            </div>
        </section>

        <div class="fireworks" id="fireworks"></div>
    </main>

    <script src="src/data/gameData.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/loading.js"></script>
    <script src="src/game.js"></script>
    <script src="src/scenes.js"></script>
    <script src="src/stabilize.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
