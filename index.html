<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Jornada de Michelle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: white;
            font-family: 'Pixelify Sans', cursive;
            background: radial-gradient(circle at top, #2d1b69 0%, #16213e 42%, #0f1020 100%);
            overflow: hidden;
        }

        .sparkles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .sparkles::before,
        .sparkles::after {
            content: '✨ 💖 ✨ 💫 ⭐ ✨ 💖 ✨';
            position: absolute;
            left: 50%;
            width: 100%;
            color: rgba(255, 215, 0, 0.65);
            font-size: 28px;
            letter-spacing: 28px;
            animation: drift 12s linear infinite;
        }

        .sparkles::before { top: 110%; }
        .sparkles::after { top: 140%; animation-delay: -6s; }

        @keyframes drift {
            from { transform: translate(-50%, 0); opacity: 0; }
            12% { opacity: 1; }
            88% { opacity: 1; }
            to { transform: translate(-50%, -150vh); opacity: 0; }
        }

        .container {
            position: relative;
            width: min(94vw, 680px);
            padding: clamp(28px, 6vw, 48px);
            text-align: center;
            background: rgba(0, 0, 0, 0.78);
            border: 4px solid gold;
            border-radius: 18px;
            box-shadow: 0 0 34px rgba(255, 215, 0, 0.45);
            z-index: 1;
        }

        h1 {
            margin-bottom: 18px;
            color: #ffd700;
            font-size: clamp(2rem, 7vw, 3.5rem);
            text-shadow: 0 0 18px rgba(255, 215, 0, 0.7), 3px 3px 0 #000;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #f2d6ff;
            font-size: clamp(1rem, 3vw, 1.25rem);
            line-height: 1.5;
        }

        .play-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-width: min(100%, 320px);
            padding: 18px 28px;
            border: 3px solid #ffd700;
            border-radius: 14px;
            color: #fff;
            text-decoration: none;
            font-size: clamp(1.25rem, 4vw, 1.6rem);
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), 0 0 16px rgba(255, 215, 0, 0.35);
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .play-button:hover,
        .play-button:focus-visible {
            transform: translateY(-4px) scale(1.02);
            filter: brightness(1.08);
            outline: none;
        }

        .notes {
            margin-top: 24px;
            color: #bfc7ff;
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="sparkles"></div>

    <main class="container">
        <h1>🏰 A Jornada de Michelle 🏰</h1>
        <p class="subtitle">
            Uma aventura mágica em 2D com versão única e responsiva para desktop, tablet e celular.
        </p>

        <a class="play-button" href="game_atualizado.html">
            <span>✨</span>
            <span>Começar a Jornada</span>
        </a>

        <p class="notes">
            No computador, use teclado. No celular, use o D-pad e o botão de ação que aparecem na tela.
        </p>
    </main>
</body>
</html>
